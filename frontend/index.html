<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="theme-color" content="#312f4d" />
    <meta name="author" content="Bard Santner Markets Inc" />

    <!-- Per-route SEO is injected by <SEO /> (react-helmet-async). The title
         below is the fallback shown to the SPA shell before React hydrates.
         Prerendered routes ship full route-specific head out of the box. -->
    <title>Bard Santner Markets Inc</title>
    <meta name="description" content="Bard Santner Markets Inc — a modern African financial platform. Banking, wealth management, trade finance, treasury and advisory." />

    <!-- GT Ultra (Grilli Type) is self-hosted (@font-face in index.css).
         No third-party CDN, no leak of client IP. Preload the faces the
         first paint needs — body text + display headings. -->
    <link rel="preload" href="/fonts/GTUltra-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/GTUltraFine-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/GTUltraFine-Light.woff2" as="font" type="font/woff2" crossorigin />

    <script type="module" src="/src/main.jsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
